<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>K-9 E ACUM</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#111827}
header{background:#111827;color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:20}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:900}.sub{font-size:12px;opacity:.65;margin-top:2px}
main{max-width:760px;margin:auto;padding:15px 14px 92px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.stat{background:#fff;border-radius:17px;padding:16px;box-shadow:0 2px 12px #0000000a}.num{font-size:27px;font-weight:900}.muted{color:#6b7280;font-size:13px}
.card{background:#fff;border-radius:17px;padding:17px;margin:0 0 13px;box-shadow:0 2px 12px #0000000a}h2,h3{margin:0 0 13px}h3{font-size:18px}
button{border:0;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:750;cursor:pointer}.primary{background:#111827;color:white}.secondary{background:#e5e7eb}.success{background:#dcfce7;color:#166534}.danger{background:#fee2e2;color:#991b1b}
.full{width:100%}.row{display:flex;gap:9px}.row>*{flex:1}input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:11px;font-size:16px;margin:5px 0 11px;background:#fff}textarea{min-height:85px;resize:vertical}
label{font-size:13px;font-weight:750}.item{border-top:1px solid #edf0f2;padding:13px 0}.item:first-child{border-top:0}.pill{display:inline-block;border-radius:999px;background:#eef0f3;padding:5px 9px;font-size:11px;font-weight:800}.total{font-size:25px;font-weight:900;text-align:right;margin-top:13px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:30}.nav button{background:none;padding:6px 5px;color:#6b7280;font-size:11px}.nav button.active{color:#111827}
.hidden{display:none!important}.search{margin-bottom:4px}.empty{text-align:center;color:#6b7280;padding:28px 8px}.photo{width:100%;border-radius:12px;margin-top:7px}
.small{font-size:12px}.right{text-align:right}
</style>
<link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></head>
<body>
<header><div class="top"><div><div class="brand">K-9 E ACUM</div><div class="sub">SERVICE AUTO • OFFLINE</div></div><button class="secondary" onclick="quickSearch()">🔎</button></div></header>
<main id="app"></main>
<nav class="nav">
<button id="n-home" onclick="go('home')">🏠<br>Acasă</button>
<button id="n-clients" onclick="go('clients')">👤<br>Clienți</button>
<button id="n-cars" onclick="go('cars')">🚗<br>Mașini</button>
<button id="n-jobs" onclick="go('jobs')">🔧<br>Service</button>
<button id="n-catalog" onclick="catalog()">🧰<br>Catalog</button><button id="n-settings" onclick="go('settings')">⚙️<br>Setări</button>
</nav>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script><script>
const KEY='K9_E_ACUM_V2';
let db=JSON.parse(localStorage.getItem(KEY)||'{"clients":[],"cars":[],"jobs":[],"settings":{"shop":"K-9 E ACUM","currency":"lei","technicians":[]}}');
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function esc(x=''){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(x){return (Number(x)||0).toFixed(2)+' '+db.settings.currency}
function go(page){
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
 const n=document.getElementById('n-'+page);if(n)n.classList.add('active');
 ({home,clients,cars,jobs,settings}[page])();
}
function home(){
 const open=db.jobs.filter(x=>x.status==='În lucru'||x.status==='Programată').length;
 document.getElementById('app').innerHTML=`
 <div class="grid">
 <div class="stat"><div class="num">${db.cars.length}</div><div class="muted">Mașini</div></div>
 <div class="stat"><div class="num">${open}</div><div class="muted">În service</div></div>
 <div class="stat"><div class="num">${db.clients.length}</div><div class="muted">Clienți</div></div>
 <div class="stat"><div class="num">${db.jobs.length}</div><div class="muted">Fișe service</div></div>
 </div>
 <div class="card" style="margin-top:13px"><button class="primary full" onclick="newJob()">＋ DESCHIDE FIȘĂ SERVICE</button></div>
 <div class="card"><h3>Mașini în service</h3>${db.jobs.filter(x=>x.status!=='Predată').slice().reverse().slice(0,6).map(jobMini).join('')||'<div class="empty">Nu sunt mașini în service.</div>'}</div>
 <div class="card"><h3>Ultimele lucrări</h3>${db.jobs.slice().reverse().slice(0,5).map(jobMini).join('')||'<div class="empty">Nicio lucrare încă.</div>'}</div>`;
}
function jobMini(j){
 const c=db.cars.find(x=>x.id===j.carId),cl=db.clients.find(x=>x.id===j.clientId);
 return `<div class="item"><b>${esc(c?.plate||'Fără număr')}</b> — ${esc(c?.make||'')} ${esc(c?.model||'')}<br><span class="muted">${esc(cl?.name||'')} • ${esc(j.problem||'Fără problemă')}</span><br><span class="pill">${esc(j.status)}</span> <b>${money(j.total)}</b> <button class="secondary" onclick="jobDetail('${j.id}')">Fișa</button></div>`;
}
function clients(){
 document.getElementById('app').innerHTML=`<div class="card"><button class="primary" onclick="clientForm()">＋ Client nou</button></div><div class="card"><input class="search" placeholder="🔎 Caută nume sau telefon" oninput="renderClients(this.value)"><div id="list"></div></div>`;
 renderClients('');
}
function renderClients(q){
 q=(q||'').toLowerCase();let arr=db.clients.filter(c=>(c.name+' '+c.phone).toLowerCase().includes(q));
 document.getElementById('list').innerHTML=arr.map(c=>`<div class="item"><b>${esc(c.name)}</b><br><span class="muted">📞 ${esc(c.phone||'-')}</span><br><button class="secondary" onclick="clientDetail('${c.id}')">Deschide</button></div>`).join('')||'<div class="empty">Nu există clienți.</div>';
}
function clientForm(){
 document.getElementById('app').innerHTML=`<div class="card"><h2>Client nou</h2><label>Nume și prenume</label><input id="name"><label>Telefon</label><input id="phone" type="tel"><label>Observații</label><textarea id="notes"></textarea><div class="row"><button class="secondary" onclick="go('clients')">Anulează</button><button class="primary" onclick="saveClient()">Salvează</button></div></div>`;
}
function saveClient(){let name=document.getElementById('name').value.trim();if(!name)return alert('Introdu numele.');db.clients.push({id:id(),name,phone:document.getElementById('phone').value.trim(),notes:document.getElementById('notes').value.trim()});save();go('clients')}
function clientDetail(cid){
 let c=db.clients.find(x=>x.id===cid),cs=db.cars.filter(x=>x.clientId===cid);
 document.getElementById('app').innerHTML=`<div class="card"><h2>${esc(c.name)}</h2><div class="muted">📞 ${esc(c.phone||'-')}</div><p>${esc(c.notes||'')}</p><button class="primary" onclick="carForm('${cid}')">＋ Adaugă mașină</button></div><div class="card"><h3>Mașinile clientului</h3>${cs.map(carMini).join('')||'<div class="empty">Nicio mașină.</div>'}</div><button class="secondary" onclick="go('clients')">← Înapoi</button>`;
}
function carMini(c){return `<div class="item"><b>${esc(c.plate)}</b> — ${esc(c.make)} ${esc(c.model)}</b><br><span class="muted">${esc(c.engine||'')} • ${esc(c.year||'-')} • ${esc(c.km||0)} km</span><br><button class="secondary" onclick="carDetail('${c.id}')">Deschide</button></div>`}
function cars(){
 document.getElementById('app').innerHTML=`<div class="card"><button class="primary" onclick="carForm()">＋ Mașină nouă</button></div><div class="card"><input placeholder="🔎 Număr / VIN / marcă / model" oninput="renderCars(this.value)"><div id="list"></div></div>`;renderCars('');
}
function renderCars(q){
 q=(q||'').toLowerCase();let arr=db.cars.filter(c=>(c.plate+' '+c.vin+' '+c.make+' '+c.model).toLowerCase().includes(q));
 document.getElementById('list').innerHTML=arr.map(carMini).join('')||'<div class="empty">Nu există mașini.</div>';
}
function carForm(cid){
 if(!cid&&!db.clients.length){alert('Adaugă mai întâi un client.');return go('clients')}
 document.getElementById('app').innerHTML=`<div class="card"><h2>Mașină nouă</h2><label>Client</label><select id="cid">${db.clients.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.name)} — ${esc(c.phone)}</option>`).join('')}</select>
 <div class="row"><div><label>Număr auto</label><input id="plate"></div><div><label>An</label><input id="year" inputmode="numeric"></div></div>
 <div class="row"><div><label>Marcă</label><input id="make"></div><div><label>Model</label><input id="model"></div></div>
 <label>Motor / cilindree</label><input id="engine" placeholder="ex. 1.6 MPI / 2.8 V6">
 <label>VIN</label><input id="vin">
 <label>Kilometraj</label><input id="km" inputmode="numeric">
 <div class="row"><button class="secondary" onclick="go('cars')">Anulează</button><button class="primary" onclick="saveCar()">Salvează</button></div></div>`;
}
function saveCar(){
 let plate=document.getElementById('plate').value.trim();if(!plate)return alert('Introdu numărul auto.');
 db.cars.push({id:id(),clientId:document.getElementById('cid').value,plate,year:document.getElementById('year').value,make:document.getElementById('make').value.trim(),model:document.getElementById('model').value.trim(),engine:document.getElementById('engine').value.trim(),vin:document.getElementById('vin').value.trim(),km:Number(document.getElementById('km').value)||0});save();go('cars');
}
function carDetail(cid){
 let c=db.cars.find(x=>x.id===cid),cl=db.clients.find(x=>x.id===c.clientId),js=db.jobs.filter(x=>x.carId===cid);
 document.getElementById('app').innerHTML=`<div class="card"><h2>${esc(c.plate)}</h2><b>${esc(c.make)} ${esc(c.model)}</b><p class="muted">${esc(c.engine||'')} • ${esc(c.year||'-')} • ${esc(c.km||0)} km<br>VIN: ${esc(c.vin||'-')}<br>Client: ${esc(cl?.name||'-')}</p><button class="primary" onclick="newJob('${cid}')">＋ Lucrare nouă</button></div><div class="card"><h3>Istoric reparații</h3>${js.slice().reverse().map(jobMini).join('')||'<div class="empty">Nicio reparație înregistrată.</div>'}</div><button class="secondary" onclick="go('cars')">← Înapoi</button>`;
}
function jobs(){
 document.getElementById('app').innerHTML=`<div class="card"><button class="primary" onclick="newJob()">＋ Fișă service nouă</button></div><div class="card"><h3>Fișe service</h3><input placeholder="🔎 Caută număr auto / client" oninput="renderJobs(this.value)"><div id="joblist"></div></div>`;renderJobs('');
}
function renderJobs(q){
 q=(q||'').toLowerCase();let arr=db.jobs.filter(j=>{let c=db.cars.find(x=>x.id===j.carId),cl=db.clients.find(x=>x.id===j.clientId);return ((c?.plate||'')+' '+(cl?.name||'')).toLowerCase().includes(q)});
 document.getElementById('joblist').innerHTML=arr.slice().reverse().map(jobMini).join('')||'<div class="empty">Nu există fișe.</div>';
}
function newJob(carId){
 if(!db.cars.length){alert('Adaugă mai întâi client și mașină.');return go('clients')}
 let selected=carId||db.cars[0].id;
 document.getElementById('app').innerHTML=`<div class="card"><h2>Fișă service nouă</h2><label>Mașină</label><select id="car">${db.cars.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.plate)} — ${esc(c.make)} ${esc(c.model)}</option>`).join('')}</select>
 <label>Status</label><select id="status"><option>Programată</option><option selected>În lucru</option><option>Gata</option><option>Predată</option></select>
 <label>Problema reclamată de client</label><textarea id="problem" placeholder="Ce spune clientul?"></textarea>
 <label>Diagnostic mecanic</label><textarea id="diag" placeholder="Ce ai constatat?"></textarea>
 <label>Lucrări efectuate</label><textarea id="work" placeholder="Ex. schimbat plăcuțe, ulei, filtre..."></textarea>
 <label>Piese (denumire + preț)</label><textarea id="parts" placeholder="Ex. Plăcuțe frână = 450&#10;Ulei motor = 300"></textarea>
 <div class="row"><div><label>Total piese</label><input id="ptotal" type="number" value="0" oninput="calc()"></div><div><label>Manoperă</label><input id="labor" type="number" value="0" oninput="calc()"></div></div>
 <label>Kilometraj la intrare</label><input id="jobkm" type="number">
 <label>Observații</label><textarea id="obs"></textarea>
 <div class="total" id="sum">TOTAL 0.00 lei</div>
 <div class="row"><button class="secondary" onclick="go('jobs')">Anulează</button><button class="primary" onclick="saveJob()">Salvează fișa</button></div></div>`;
}
function calc(){let a=Number(document.getElementById('ptotal')?.value)||0,b=Number(document.getElementById('labor')?.value)||0;document.getElementById('sum').textContent='TOTAL '+money(a+b)}
function saveJob(){
 let car=db.cars.find(x=>x.id===document.getElementById('car').value),p=Number(document.getElementById('ptotal').value)||0,l=Number(document.getElementById('labor').value)||0;
 if(document.getElementById('jobkm').value)car.km=Number(document.getElementById('jobkm').value);
 db.jobs.push({id:id(),clientId:car.clientId,carId:car.id,status:document.getElementById('status').value,problem:document.getElementById('problem').value.trim(),diagnosis:document.getElementById('diag').value.trim(),work:document.getElementById('work').value.trim(),parts:document.getElementById('parts').value.trim(),partsTotal:p,labor:l,total:p+l,obs:document.getElementById('obs').value.trim(),date:new Date().toLocaleString('ro-RO'),photoBefore:'',photoAfter:''});save();jobDetail(db.jobs.at(-1).id)
}
function jobDetail(jid){
 let j=db.jobs.find(x=>x.id===jid),c=db.cars.find(x=>x.id===j.carId),cl=db.clients.find(x=>x.id===j.clientId);
 document.getElementById('app').innerHTML=`<div class="card"><h2>Fișă #${esc(j.id.slice(-5).toUpperCase())}</h2><b>${esc(c.plate)} — ${esc(c.make)} ${esc(c.model)}</b><p class="muted">${esc(cl?.name||'')} • ${esc(j.date)}<br>${esc(c.engine||'')} • ${esc(c.km||0)} km</p><span class="pill">${esc(j.status)}</span></div>
 <div class="card"><h3>Diagnostic și lucrări</h3><label>Problema clientului</label><p>${esc(j.problem)||'-'}</p><label>Diagnostic</label><p>${esc(j.diagnosis)||'-'}</p><label>Lucrări</label><p>${esc(j.work)||'-'}</p><label>Piese</label><p>${esc(j.parts)||'-'}</p><label>Observații</label><p>${esc(j.obs)||'-'}</p></div>
 <div class="card"><div class="row"><div>Piese<br><b>${money(j.partsTotal)}</b></div><div>Manoperă<br><b>${money(j.labor)}</b></div></div><div class="total">TOTAL ${money(j.total)}</div></div>
 <div class="card"><h3>Fotografii</h3><label>Poze înainte</label><input type="file" accept="image/*" capture="environment" onchange="photo('${j.id}','before',this)">
 <label>Poze după</label><input type="file" accept="image/*" capture="environment" onchange="photo('${j.id}','after',this)">
 ${j.photoBefore?`<img class="photo" src="${j.photoBefore}">`:''}${j.photoAfter?`<img class="photo" src="${j.photoAfter}">`:''}</div>
 <div class="row"><button class="secondary" onclick="go('jobs')">← Înapoi</button><button class="success" onclick="printJob('${j.id}')">📄 Fișă / Print</button></div>`;
}
function photo(jid,type,input){
 let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let j=db.jobs.find(x=>x.id===jid);if(type==='before')j.photoBefore=r.result;else j.photoAfter=r.result;save();jobDetail(jid)};r.readAsDataURL(f);
}
function printJob(jid){
 let j=db.jobs.find(x=>x.id===jid),c=db.cars.find(x=>x.id===j.carId),cl=db.clients.find(x=>x.id===j.clientId);
 let w=window.open('','_blank');if(!w)return;
 w.document.write(`<html><head><title>K-9 E ACUM</title><style>body{font-family:Arial;padding:30px}h1{margin-bottom:3px}.line{border-top:1px solid #ddd;padding:10px 0}.total{font-size:22px;font-weight:bold;text-align:right}</style><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"></head><body><h1>K-9 E ACUM</h1><div>FIȘĂ SERVICE</div><hr><p><b>Client:</b> ${esc(cl?.name||'')}<br><b>Telefon:</b> ${esc(cl?.phone||'-')}<br><b>Mașină:</b> ${esc(c.plate)} — ${esc(c.make)} ${esc(c.model)}<br><b>VIN:</b> ${esc(c.vin||'-')}<br><b>Km:</b> ${esc(c.km||0)}</p><div class="line"><b>Problemă:</b><br>${esc(j.problem)}</div><div class="line"><b>Diagnostic:</b><br>${esc(j.diagnosis)}</div><div class="line"><b>Lucrări:</b><br>${esc(j.work)}</div><div class="line"><b>Piese:</b><br>${esc(j.parts)}</div><p>Piese: ${money(j.partsTotal)}<br>Manoperă: ${money(j.labor)}</p><div class="total">TOTAL: ${money(j.total)}</div><p>Data: ${esc(j.date)}</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()
}
function settings(){
 const s=serviceSummary(),techs=db.settings.technicians||[];
 document.getElementById('app').innerHTML=`<div class="card"><h2>Setări service</h2>
 <label>Numele service-ului</label><input id="shop" value="${esc(db.settings.shop)}">
 <label>Monedă</label><select id="currency"><option ${db.settings.currency==='lei'?'selected':''}>lei</option><option ${db.settings.currency==='€'?'selected':''}>€</option><option ${db.settings.currency==='$'?'selected':''}>$</option></select>
 <button class="primary full" onclick="saveSettings()">Salvează</button></div>
 <div class="card"><h3>👨‍🔧 Mecanici</h3>${techs.map(t=>`<div class="item"><b>${esc(t.name)}</b></div>`).join('')||'<div class="muted">Niciun mecanic adăugat.</div>'}
 <button class="secondary" onclick="addTechnician()">＋ Adaugă mecanic</button></div>
 <div class="card"><h3>📊 Raport service</h3><div class="row"><div><b>${money(s.revenue)}</b><br><span class="muted">Încasări</span></div><div><b>${money(s.labor)}</b><br><span class="muted">Manoperă</span></div></div><p><b>${money(s.parts)}</b> — valoare piese</p><button class="secondary" onclick="exportCSV()">⬇️ Export Excel/CSV</button></div>
 <div class="card"><h3>💾 Backup</h3><p class="muted">Datele sunt salvate local pe telefon. Fă backup periodic.</p><button class="primary" onclick="backup()">⬇️ Export backup</button> <button class="secondary" onclick="document.getElementById('restore').click()">⬆️ Import backup</button><input id="restore" type="file" accept=".json" class="hidden" onchange="restore(this)"></div>
 <div class="card"><h3>Despre</h3><p><b>K-9 E ACUM</b><br>Service Auto • V4 Complete • Offline</p><button class="danger" onclick="if(confirm('Ștergi toate datele?')){localStorage.removeItem(KEY);location.reload()}">Șterge toate datele</button></div>`;
}
function saveSettings(){db.settings.shop=document.getElementById('shop').value.trim()||'K-9 E ACUM';db.settings.currency=document.getElementById('currency').value;save();go('settings')}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='K9_E_ACUM_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function restore(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert('Backup restaurat.');go('home')}catch(e){alert('Backup invalid.')}};r.readAsText(f)}
go('home');
</script>
</body></html>
