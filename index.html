px;margin-bottom:8px}.opts button{display:block;width:100%;text-align:left;background:#f6f6f6;border:0;border-bottom:1px solid #ddd;padding:12px}.toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:10px;z-index:200;display:none}.history{position:fixed;right:12px;top:55px;background:white;z-index:60;width:min(360px,90vw);border-radius:12px;padding:12px;display:none;box-shadow:0 5px 25px #000}.history.open{display:block}.item{padding:10px;border-bottom:1px solid #ddd;cursor:pointer}.hint{font-size:11px;color:#555}

</style></head><body>
<div class="top"><b>🚗 K-9 E ACUM • FIȘĂ SERVICE</b><button class="btn light" onclick="fit()">Încadrare</button><button class="btn light" onclick="zoom(-.1)">−</button><button class="btn light" onclick="zoom(.1)">+</button><button class="btn red" onclick="save()">💾 Salvează</button><button class="btn light" onclick="window.print()">🖨️ A4</button><button class="btn light" onclick="showHistory()">📋 Istoric</button></div>

<script>

'Chevrolet':['Spark','Aveo','Cruze','Lacetti','Captiva','Orlando','Trax'],
'Mitsubishi':['Colt','Lancer','ASX','Outlander','Pajero','L200'],

const works=['1.1 Schimb ulei motor','1.2 Schimb filtru ulei','1.3 Schimb filtru aer','1.4 Schimb filtru combustibil','1.5 Schimb filtru polen','1.6 Curățare admisie','1.7 Curățare clapetă accelerație','1.8 Schimb bujii','1.9 Verificare compresie','1.10 Verificare scurgeri ulei','1.11 Reparație motor','1.12 Garnitură chiulasă','1.13 Reglaj supape','1.14 Schimb curea accesorii','1.15 Schimb întinzător curea','1.16 Schimb role','1.17 Alte lucrări motor','2.1 Schimb ulei cutie','2.2 Schimb ambreiaj','2.3 Schimb volantă','2.4 Schimb planetare','2.5 Verificare/schimb semeringuri','2.6 Reparație cutie viteze','2.7 Reparație diferențial','2.8 Reparație transmisie','2.9 Reparație transmisie automată','2.10 Schimb ulei ATF','2.11 Alte lucrări transmisie','3.1 Schimb plăcuțe frână','3.2 Schimb discuri frână','3.3 Schimb saboți frână','3.4 Schimb cilindri frână','3.5 Schimb lichid frână','3.6 Aerisire sistem frânare','3.7 Verificare etriere','3.8 Verificare furtune frână','3.9 Reglaj frână de mână','3.10 Verificare ABS','3.11 Reparare etriere','3.12 Alte lucrări frânare'];
let data=JSON.parse(localStorage.getItem('k9current')||'{}');let zoomLevel=1, modalType='';
function val(k){return data[k]||''} function field(k,x,y,w,h=24){let e=document.createElement('input');e.className='field';e.value=val(k);e.placeholder='';e.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;e.oninput=()=>data[k]=e.value;return e}
function sel(k,x,y,w,label){let e=document.createElement('button');e.className='sel';e.textContent=val(k)||label;e.style.cssText=`left:${x}px;top:${y}px;width:${w}px`;e.onclick=()=>openSelect(k);return e}
function ta(k,x,y,w,h){let e=document.createElement('textarea');e.className='ta';e.value=val(k);e.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;e.oninput=()=>data[k]=e.value;return e}

function build(){const s=document.getElementById('sheet');s.innerHTML='';
// Header/customer/vehicle fields
[['doc',850,25,130],['date',850,72,130],['kmin',850,120,130],['kmout',850,168,130],['client',35,250,430],['phone',35,278,220],['email',300,278,180],['address',35,307,430],['plate',720,278,250],['vin',565,307,405],['engine',565,333,215],['fuel',820,333,150]].forEach(a=>s.appendChild(field(...a)));
s.appendChild(sel('make',565,250,205,'MARCA'));s.appendChild(sel('model',775,250,195,'MODEL'));let years=[];for(let y=2026;y>=1980;y--)years.push(y);s.appendChild(sel('year',565,278,150,'AN FABRICAȚIE'));
s.appendChild(field('recDate',35,383,145));s.appendChild(field('recTime',225,383,90));s.appendChild(ta('decl',375,380,290,110));s.appendChild(ta('found',690,380,290,110));
s.appendChild(ta('other',35,490,290,55));s.appendChild(ta('obs',690,490,290,55));
// work checkboxes arranged across 10 columns, based on printed form
for(let c=0;c<10;c++){let count=c<5?17:9;let x=34+c%5*194;let y=c<5?572:903;for(let r=0;r<count;r++)s.appendChild(addCheck('w'+c+'_'+r,x,y+r*20));}
// final checks
[[40,1290],[220,1290],[430,1290],[640,1290],[40,1315],[220,1315],[430,1315],[640,1315],[40,1340],[220,1340],[430,1340]].forEach((p,i)=>s.appendChild(addCheck('f'+i,...p)));

// old parts returned DA/NU
s.appendChild(addCheck('returnedYes',490,1115));s.appendChild(addCheck('returnedNo',565,1115));
let p=document.createElement('div');p.className='parts';for(let i=0;i<10;i++){let row=document.createElement('div');row.className='r';row.innerHTML=`<span>${i+1}</span><input value="${data['p'+i+'_name']||''}"><input value="${data['p'+i+'_code']||''}"><input value="${data['p'+i+'_qty']||''}"><input value="${data['p'+i+'_obs']||''}">`;let ins=row.querySelectorAll('input');ins.forEach((el,j)=>el.oninput=()=>data['p'+i+['_name','_code','_qty','_obs'][j]]=el.value);p.appendChild(row)}s.appendChild(p);
}
function openSelect(k){modalType=k;document.getElementById('modal').classList.add('open');document.getElementById('msearch').value='';document.getElementById('mtitle').textContent=k==='make'?'Selectează marca':k==='model'?'Selectează modelul':'Selectează anul';renderOpts();setTimeout(()=>document.getElementById('msearch').focus(),50)}
function renderOpts(){let q=document.getElementById('msearch').value.toLowerCase(),arr;if(modalType==='make')arr=Object.keys(catalog);else if(modalType==='model')arr=catalog[data.make]||[];else arr=Array.from({length:47},(_,i)=>String(2026-i));arr=arr.filter(x=>x.toLowerCase().includes(q));document.getElementById('opts').innerHTML=arr.map(x=>`<button onclick="choose(${JSON.stringify(x)})">${x}</button>`).join('')||'<div class="hint">Nu am găsit. Poți adăuga ulterior marca/modelul.</div>'}
function choose(x){data[modalType]=x;if(modalType==='make'){data.model=''}closeModal();build()};function closeModal(){document.getElementById('modal').classList.remove('open')}
function save(){localStorage.setItem('k9current',JSON.stringify(data));let h=JSON.parse(localStorage.getItem('k9history')||'[]');h.unshift({id:Date.now(),date:new Date().toLocaleString('ro-RO'),make:data.make||'',model:data.model||'',plate:data.plate||'',data:{...data}});h=h.slice(0,50);localStorage.setItem('k9history',JSON.stringify(h));toast('Fișa a fost salvată.')}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function showHistory(){let e=document.getElementById('history');e.classList.toggle('open');let h=JSON.parse(localStorage.getItem('k9history')||'[]');document.getElementById('histList').innerHTML=h.length?h.map((a,i)=>`<div class=item onclick="loadHist(${i})"><b>${a.make||'Fără marcă'} ${a.model||''}</b><br>${a.plate||'Fără nr.'} • ${a.date}</div>`).join(''):'<div class=hint>Nicio fișă salvată.</div>'}
function loadHist(i){let h=JSON.parse(localStorage.getItem('k9history')||'[]');data=h[i].data;localStorage.setItem('k9current',JSON.stringify(data));build();showHistory();toast('Fișa a fost încărcată.')}
function fit(){zoomLevel=Math.min(1,(innerWidth-10)/1024);document.getElementById('sheet').style.transform=`scale(${zoomLevel})`;document.getElementById('wrap').style.height=(1536*zoomLevel+20)+'px'}function zoom(d){zoomLevel=Math.max(.45,Math.min(1.6,zoomLevel+d));document.getElementById('sheet').style.transform=`scale(${zoomLevel})`;document.getElementById('wrap').style.height=(1536*zoomLevel+20)+'px'}
build();setTimeout(fit,50);
</script></body></html>
